      const col = i === 4 && (cur || done) ? '#dc322f' : (this.MODE[i] === 'manual' ? '#268bd2' : '#8fc0e8');
      return {
        label: label, aria: T.phase + ' ' + (i + 1) + ': ' + label,
        current: cur ? 'step' : 'false',
        pick: () => this.goStep(i),
        fill: 'display: block; height: 100%; width: ' + w + '%; background: ' + col + '; transition: width .12s linear',
        labelStyle: 'font-size: 11.5px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (cur ? '#e4e5e5' : (done ? '#979899' : '#6f7071'))
      };
    });
    const langs = ['de', 'en', 'el'].map((c) => ({
      code: c.toUpperCase(), pressed: this.state.lang === c ? 'true' : 'false',
      pick: () => { this.setState({ lang: c }); setTimeout(() => this.rebuildReport(), 0); },
      style: 'background: ' + (this.state.lang === c ? '#3f4040' : 'transparent') + '; color: ' + (this.state.lang === c ? '#e4e5e5' : '#979899') + '; border: 1px solid #404242; border-radius: 4px; padding: 6px 10px; min-height: 36px; min-width: 44px; cursor: pointer; font-family: inherit; font-size: 12px'
    }));
    return {
      t: T, langs: langs, rail: rail,
      rootRef: this.setRoot, canvasRef: this.setCanvas,
      onMove: this.onMove, onLeave: this.onLeave,
      phaseNo: T.phase + ' ' + String(step + 1).padStart(2, '0') + ' / 06',
      modeLabel: T.modes[mode], modeColor: modeColor,
      title: T.titles[step], hit: T.hits[step], fadeKey: step + '-' + this.state.lang,
      cmd: cmd
    };
  }
}
</script>
