server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/xml;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;

    # RFC 9116 allows the legacy location as a redirect
    location = /security.txt {
        return 301 /.well-known/security.txt;
    }

    # Version identifier of the running build, see specs/001-version-display.md
    location = /version {
        default_type text/plain;
        expires -1;
        try_files /version =404;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
