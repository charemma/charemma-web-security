server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript;
    server_tokens off;
    # TLS ends in front of nginx; relative Location headers keep https
    absolute_redirect off;

    # No Content-Security-Policy yet: the imported mockup uses inline styles,
    # inline scripts and Google Fonts. A later spec adds it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Version identifier of the running build, see specs/013-site-images.md
    location = /version {
        default_type text/plain;
        try_files /version =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
