# Browser cache rules per kind of response, see specs/008-browser-caching.md.
# One add_header in the server block applies them; a location with its own
# add_header would stop inheriting the security headers.
map $arg_v $script_style_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

map $uri $cache_control {
    default                 "no-cache";
    ~^/assets/(css|js)/     $script_style_cache;
    ~^/assets/              "public, max-age=604800";
}

# Language prefixes and paths, written by the generator from site.json, see
# specs/013-localized-paths.md: $former_lang_uri and $default_lang_uri.
include /etc/nginx/snippets/language-paths.conf;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/xml;
    server_tokens off;
    # TLS ends in front of nginx; relative Location headers keep https, see specs/009-published-languages.md
    absolute_redirect off;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $cache_control always;

    error_page 404 /404.html;

    # Former addresses lead permanently to the language's own paths, before the
    # redirect of a missing address, see specs/013-localized-paths.md
    if ($former_lang_uri) {
        return 301 $former_lang_uri$is_args$args;
    }

    # RFC 9116 allows the legacy location as a redirect
    location = /security.txt {
        return 301 /.well-known/security.txt;
    }

    # Version identifier of the running build, see specs/001-version-display.md
    location = /version {
        default_type text/plain;
        try_files /version =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Pages of a published language exist and are served; addresses without a
    # file under a language prefix lead temporarily to the default language, so
    # they can come back; any other address without a file is not found
    location @default_lang {
        if ($default_lang_uri) {
            return 302 $default_lang_uri$is_args$args;
        }
        return 404;
    }

    location / {
        try_files $uri $uri/ @default_lang;
    }
}
