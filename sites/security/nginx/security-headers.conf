add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.charemma.de; style-src 'self'; img-src 'self' data: https://stats.charemma.de; font-src 'self'; connect-src 'self' https://stats.charemma.de; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
