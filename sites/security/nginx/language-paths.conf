# Generated by src/build.py from src/site.json; do not edit.
# Former addresses under the default language's paths, see specs/013-localized-paths.md.
map $uri $former_lang_uri {
    ~^/en/so-teste-ich/(.*)$  /en/how-i-test/$1;
    ~^/en/wissen/ki-sicherheit/(.*)$  /en/knowledge/ai-security/$1;
    ~^/en/datenschutz/(.*)$  /en/privacy/$1;
}

# Addresses of a language without a file: the same page in the default language,
# see specs/009-published-languages.md and specs/013-localized-paths.md.
map $uri $default_lang_uri {
    ~^/en/knowledge/ai-security/(.*)$  /wissen/ki-sicherheit/$1;
    ~^/en/how-i-test/(.*)$  /so-teste-ich/$1;
    ~^/en/privacy/(.*)$  /datenschutz/$1;
    ~^/en$  /;
    ~^/en(/.*)$  $1;
    ~^/el/wissen/ki-sicherheit/(.*)$  /wissen/ki-sicherheit/$1;
    ~^/el/so-teste-ich/(.*)$  /so-teste-ich/$1;
    ~^/el/datenschutz/(.*)$  /datenschutz/$1;
    ~^/el$  /;
    ~^/el(/.*)$  $1;
}
