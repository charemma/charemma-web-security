name: Build and Push Container Images

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  # Fixed image prefix, not github.repository, see specs/013-site-images.md
  IMAGE_PREFIX: ghcr.io/charemma/charemma-web-

jobs:
  # Sites whose folder changed (k8s/ excluded), or all sites when this workflow changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: sites
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          all="$(find sites -mindepth 1 -maxdepth 1 -type d -printf '%f\n')"
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed="$all"
          else
            files="$(git diff --name-only "$BASE" HEAD)"
            if printf '%s\n' "$files" | grep -qx '.github/workflows/build.yml'; then
              changed="$all"
            else
              changed="$(printf '%s\n' "$files" | grep '^sites/' | grep -v '^sites/[^/]*/k8s/' | cut -d/ -f2 | sort -u)"
            fi
          fi
          echo "sites=$(printf '%s\n' "$changed" | jq -R . | jq -sc 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.sites != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.sites) }}
    defaults:
      run:
        working-directory: sites/${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - run: just check

  build:
    needs: [changes, check]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.sites) }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Same short hash that docker/metadata-action uses for the sha- tag
      - id: version
        run: echo "id=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}${{ matrix.site }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v5
        with:
          context: sites/${{ matrix.site }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_VERSION=${{ steps.version.outputs.id }}
